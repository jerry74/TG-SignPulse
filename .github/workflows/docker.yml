name: TG-SignPlus image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tg-signplus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev-next.txt
      - run: pytest --cov=signplus --cov-report=term-missing
      - run: ruff check signplus tests_next
      - run: mypy signplus
      - run: pip-audit -r requirements-next.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - working-directory: frontend-next
        run: npm ci
      - working-directory: frontend-next
        run: npm test
      - working-directory: frontend-next
        run: npm run typecheck
      - working-directory: frontend-next
        run: npm run build
      - working-directory: frontend-next
        run: npm audit --audit-level=high

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/tg-signplus:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.next
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
