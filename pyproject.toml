[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-signer"
dynamic = ["version"]
description = "Automated Telegram tasks (check-ins, sending messages, keyboard clicks, AI replies, etc.); monitoring, forwarding, and auto-replying to private, group, and channel messages."
authors = [
    { name = "Amchii", email = "finethankuandyou@gmail.com" }
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only"
]
dependencies = [
    "kurigram<=2.2.7",
    "click",
    "pydantic>=2.13.4",
    "openai",
    "croniter",
    "json_repair",
    "typing-extensions",
    "httpx",
    "fastapi>=0.141.1",
    "uvicorn[standard]",
    "sqlalchemy",
    "apscheduler",
    "python-jose[cryptography]",
    "python-multipart",
    "pyotp",
    "passlib[bcrypt]",
    "bcrypt",
    "qrcode[pil]",
    "cryptography>=43",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "tox>=4.32.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.0",
    "mypy>=1.15",
]

[project.optional-dependencies]
speedup = [
    "tgcrypto"
]

[project.urls]
Homepage = "https://github.com/amchii/tg-signer"
Repository = "https://github.com/amchii/tg-signer"

[project.scripts]
tg-signer = "tg_signer.__main__:signer"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "tg_signer.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I", # isort
    "B", # flake8-bugbear
    "W", # pycodestyle
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
    "B019", # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
    "B904"  # raise without from inside except
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_next"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
exclude = "^(backend|tg_signer|frontend)/"
