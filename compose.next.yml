services:
  app:
    image: ${TG_SIGNPLUS_IMAGE:?TG_SIGNPLUS_IMAGE is required}
    container_name: tg-signplus
    restart: unless-stopped
    init: true
    ports:
      - "192.168.31.240:18080:8080"
    environment:
      APP_DATA_DIR: /data
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      TG_API_ID: ${TG_API_ID:?TG_API_ID is required}
      TG_API_HASH: ${TG_API_HASH:?TG_API_HASH is required}
      TG_PROXY: ${TG_PROXY:-}
      ENABLE_FAILURE_NOTIFIER: "false"
      TZ: Asia/Taipei
      SCHEDULER_POLL_SECONDS: "15"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/__pycache__
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
